<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
<title id="title">Fluxo do Sistema de Gestao de Eventos</title>
<desc id="desc">Fluxo de consulta de eventos, validacao da inscricao e controle de vagas.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#a42bca"/></marker>
<style>.bg{fill:#f7f2fb}.n{fill:#fff;stroke:#dccbe4;stroke-width:2}.d{fill:#f5e4fa;stroke:#a42bca;stroke-width:2}.l{stroke:#a42bca;stroke-width:3;fill:none;marker-end:url(#a)}text{font:700 18px Arial;text-anchor:middle;fill:#29222d}.s{font-size:15px;fill:#6d6573}</style></defs>
<rect class="bg" width="980" height="720" rx="20"/>
<rect class="n" x="310" y="35" width="360" height="60" rx="8"/><text x="490" y="72">Participante consulta eventos</text>
<path class="l" d="M490 95V135"/><rect class="n" x="310" y="135" width="360" height="60" rx="8"/><text x="490" y="172">Seleciona evento e informa dados</text>
<path class="l" d="M490 195V235"/><path class="d" d="M490 235L680 300L490 365L300 300Z"/><text x="490" y="295">Dados validos?</text>
<path class="l" d="M300 300H155V415"/><text class="s" x="225" y="282">Nao</text><rect class="n" x="30" y="415" width="250" height="65" rx="8"/><text x="155" y="453">Exibe erros</text>
<path class="l" d="M490 365V405"/><text class="s" x="525" y="390">Sim</text><path class="d" d="M490 405L680 470L490 535L300 470Z"/><text x="490" y="465">Ha vaga?</text>
<path class="l" d="M300 470H155V575"/><text class="s" x="230" y="452">Nao</text><rect class="n" x="30" y="575" width="250" height="70" rx="8"/><text x="155" y="605">Registra solicitacao</text><text x="155" y="628">na lista de espera</text>
<path class="l" d="M490 535V575"/><text class="s" x="525" y="560">Sim</text><rect class="n" x="320" y="575" width="340" height="70" rx="8"/><text x="490" y="605">Registra inscricao</text><text x="490" y="628">e gera comprovante</text>
</svg>